<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Transform | Image Editor</title>
    <!-- Tailwind CSS for rapid, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for specific elements not easily handled by standard Tailwind utilities */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #111827; /* Tailwind gray-900 */
            color: #f9fafb; /* Tailwind gray-50 */
        }
        
        .canvas-container {
            background-image: linear-gradient(45deg, #1f2937 25%, transparent 25%), 
                              linear-gradient(-45deg, #1f2937 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1f2937 75%), 
                              linear-gradient(-45deg, transparent 75%, #1f2937 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        #imageCanvas {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: none; /* Hidden until image is uploaded */
        }

        /* Hide the default file input text */
        input[type=file]::file-selector-button {
            margin-right: 20px;
            border: none;
            background: #3b82f6;
            padding: 10px 20px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: background .2s ease-in-out;
        }
        input[type=file]::file-selector-button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md z-10">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                Retro Transform
            </h1>
            <p class="text-sm text-gray-400">Canvas Image Processor</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8 w-full max-w-7xl mx-auto flex flex-col lg:flex-row gap-8">
        
        <!-- Left Column: Controls -->
        <aside class="w-full lg:w-1/3 space-y-6">
            
            <!-- Upload Section -->
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                    </svg>
                    1. Upload Image
                </h2>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col w-full h-32 border-2 border-dashed border-gray-600 hover:border-blue-500 hover:bg-gray-700/50 transition rounded-xl cursor-pointer">
                        <div class="flex flex-col items-center justify-center pt-7">
                            <p class="text-sm text-gray-400 font-medium">Click to browse files</p>
                            <p class="text-xs text-gray-500 mt-1">PNG, JPG, WEBP</p>
                        </div>
                        <input type="file" id="imageUpload" accept="image/*" class="opacity-0 w-0 h-0" />
                    </label>
                </div>
            </div>

            <!-- Filters Section -->
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg opacity-50 pointer-events-none transition-opacity duration-300" id="filtersPanel">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.3 1.046A120.18 120.18 0 001 10c0 5.523 4.477 10 10 10s10-4.477 10-10a120.18 120.18 0 00-10.3-8.954zM10 16a6 6 0 100-12 6 6 0 000 12z" clip-rule="evenodd" />
                    </svg>
                    2. Apply Filters
                </h2>
                <div class="grid grid-cols-1 gap-3">
                    <button class="filter-btn active w-full py-3 px-4 bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded-xl text-left font-medium transition focus:outline-none focus:ring-2 focus:ring-blue-500" data-filter="none">
                        Normal
                        <span class="block text-xs text-gray-400 font-normal mt-1">Original image colors</span>
                    </button>
                    <button class="filter-btn w-full py-3 px-4 bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded-xl text-left font-medium transition focus:outline-none focus:ring-2 focus:ring-blue-500" data-filter="contrast(1.3) saturate(1.4) sepia(0.35) brightness(1.05) hue-rotate(-5deg)">
                        90s Retro Anime
                        <span class="block text-xs text-gray-400 font-normal mt-1">High contrast, saturated, warm vintage tone</span>
                    </button>
                    <button class="filter-btn w-full py-3 px-4 bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded-xl text-left font-medium transition focus:outline-none focus:ring-2 focus:ring-blue-500" data-filter="grayscale(100%) contrast(1.2)">
                        Grayscale
                        <span class="block text-xs text-gray-400 font-normal mt-1">Classic black and white</span>
                    </button>
                </div>
            </div>

            <!-- Action Section -->
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg opacity-50 pointer-events-none transition-opacity duration-300" id="actionsPanel">
                <button id="downloadBtn" class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg transform transition hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-blue-500 flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    Download Image
                </button>
            </div>
        </aside>

        <!-- Right Column: Canvas Preview -->
        <section class="w-full lg:w-2/3 flex flex-col">
            <div class="bg-gray-800 rounded-2xl border border-gray-700 shadow-xl overflow-hidden flex-grow flex flex-col relative h-[500px] lg:h-auto">
                
                <!-- Canvas Toolbar/Header -->
                <div class="bg-gray-900/50 border-b border-gray-700 p-3 flex justify-between items-center absolute top-0 w-full z-10 backdrop-blur-sm">
                    <span class="text-sm text-gray-300 font-medium">Preview</span>
                    <span id="imageDimensions" class="text-xs text-gray-500 font-mono"></span>
                </div>

                <!-- Canvas Container -->
                <div class="canvas-container w-full h-full flex items-center justify-center p-4 relative pt-14">
                    
                    <!-- Placeholder when no image -->
                    <div id="canvasPlaceholder" class="text-center text-gray-500 flex flex-col items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p>Upload an image to see it here</p>
                    </div>

                    <!-- The actual canvas element -->
                    <canvas id="imageCanvas" class="rounded shadow-2xl transition-all duration-300"></canvas>
                </div>
            </div>
        </section>

    </main>

    <script>
        // DOM Elements
        const imageUpload = document.getElementById('imageUpload');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const canvasPlaceholder = document.getElementById('canvasPlaceholder');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const downloadBtn = document.getElementById('downloadBtn');
        const filtersPanel = document.getElementById('filtersPanel');
        const actionsPanel = document.getElementById('actionsPanel');
        const imageDimensions = document.getElementById('imageDimensions');

        // State variables
        let originalImage = null;
        let currentFilter = 'none';

        // 1. Handle File Upload
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Only accept images
            if (!file.type.match('image.*')) {
                alert('Please select a valid image file.');
                return;
            }

            const reader = new FileReader();

            reader.onload = function(event) {
                // Create a new Image object
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    
                    // Set canvas internal resolution to match image resolution for high-quality downloads
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // Update UI
                    imageDimensions.textContent = `${img.width} × ${img.height}px`;
                    canvasPlaceholder.style.display = 'none';
                    canvas.style.display = 'block';
                    
                    // Enable panels
                    filtersPanel.classList.remove('opacity-50', 'pointer-events-none');
                    actionsPanel.classList.remove('opacity-50', 'pointer-events-none');
                    
                    // Draw initial image
                    applyFilterAndDraw(currentFilter);
                }
                img.src = event.target.result;
            }

            reader.readAsDataURL(file);
        });

        // 2. Handle Filter Buttons
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                if (!originalImage) return;

                // Update active state styling
                filterBtns.forEach(b => {
                    b.classList.remove('ring-2', 'ring-blue-500', 'bg-gray-600');
                    b.classList.add('bg-gray-700');
                });
                this.classList.remove('bg-gray-700');
                this.classList.add('ring-2', 'ring-blue-500', 'bg-gray-600');

                // Get filter from data attribute and apply
                currentFilter = this.getAttribute('data-filter');
                applyFilterAndDraw(currentFilter);
            });
        });

        // Core function to draw image with applied filter
        function applyFilterAndDraw(filterString) {
            if (!originalImage) return;

            // Clear previous canvas content
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Set the CSS filter string on the canvas 2D context
            // This applies the filter to the actual bitmap data, ensuring it is saved during download
            ctx.filter = filterString;
            
            // Draw the original image onto the canvas with the filter applied
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
        }

        // 3. Handle Download
        downloadBtn.addEventListener('click', function() {
            if (!originalImage) return;

            // Convert canvas data to a Data URL (PNG format)
            const dataURL = canvas.toDataURL('image/png');
            
            // Create a temporary link element to trigger the download
            const link = document.createElement('a');
            link.download = `retro-transform-${Date.now()}.png`;
            link.href = dataURL;
            
            // Trigger click and cleanup
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
